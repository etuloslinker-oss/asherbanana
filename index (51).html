<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asher’s Banana</title>
<meta name="description" content="Asher’s games, with a live preview of each one.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0e1b2c; --bg2:#1b3a5c; --bg3:#07101b;
  --ink:#f2f6fb; --muted:#9db3cb; --green:#5ba32b; --green2:#76c93a; --tile:#16263a;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);background:var(--bg3);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto;
  background:radial-gradient(120% 90% at 20% 0%,var(--bg2) 0%,var(--bg1) 55%,var(--bg3) 100%);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 4vw;position:relative;z-index:3}
.brand{font-weight:800;font-size:clamp(18px,2.4vw,26px);letter-spacing:.2px}
.clock{font-weight:500;font-size:clamp(16px,2vw,22px);color:var(--muted);font-variant-numeric:tabular-nums}

.hero{position:relative;min-height:0;overflow:hidden;margin-top:-72px}
.bg{position:absolute;inset:0;background:#0b1522}
.bg iframe{position:absolute;left:50%;top:50%;width:1280px;height:720px;border:0;pointer-events:none;background:#fff;transform-origin:center;opacity:0;transition:opacity .5s}
.bg iframe.on{opacity:.85}
.hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(90deg,rgba(7,16,27,.95) 0%,rgba(7,16,27,.75) 35%,rgba(7,16,27,0) 70%),
             linear-gradient(0deg,var(--bg1) 0%,rgba(14,27,44,0) 40%),
             linear-gradient(180deg,rgba(7,16,27,.8) 0%,rgba(7,16,27,0) 25%)}
.meta{position:absolute;z-index:2;left:4vw;bottom:5vh;max-width:min(520px,88vw)}
.meta h1{margin:0 0 10px;font-weight:800;font-size:clamp(30px,5.4vw,64px);line-height:1.05;letter-spacing:-1px}
.meta p{margin:0 0 22px;color:#c9d8e8;font-size:clamp(16px,1.7vw,21px);line-height:1.45;max-width:46ch}
.play{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--green2),var(--green));color:#fff;text-decoration:none;
  font-weight:800;font-size:clamp(17px,1.8vw,22px);padding:14px 38px;border-radius:3px;box-shadow:0 4px 18px rgba(91,163,43,.35);transition:filter .15s,transform .15s}
.play:hover{filter:brightness(1.12)}
.play:active{transform:scale(.97)}
.play svg{width:.9em;height:.9em;fill:currentColor}

.shelf{display:flex;gap:clamp(14px,1.8vw,26px);overflow-x:auto;padding:26px 4vw 30px;scroll-snap-type:x proximity;scrollbar-width:none;position:relative;z-index:3;
  background:linear-gradient(180deg,rgba(14,27,44,0),var(--bg1) 22%)}
.shelf::-webkit-scrollbar{display:none}
.tile{flex:none;width:clamp(200px,22vw,300px);scroll-snap-align:center;appearance:none;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
  transform:scale(.94);opacity:.72;transition:transform .18s ease,opacity .18s}
.tile .art{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--tile);border-radius:3px;outline:3px solid transparent;outline-offset:3px;transition:outline-color .12s,box-shadow .18s}
.tile .art iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:800;color:var(--muted)}
.tile .name{display:block;margin-top:12px;font-weight:700;font-size:16px;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sel{transform:scale(1.06);opacity:1}
.tile.sel .art{outline-color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 28px rgba(160,205,255,.35)}
.tile.sel .name{opacity:1}
.tile:focus-visible{outline:none}

.hint{display:flex;gap:26px;justify-content:center;padding:0 4vw 16px;color:var(--muted);font-size:14px;position:relative;z-index:3;background:var(--bg1)}
.hint b{display:inline-block;min-width:24px;text-align:center;padding:1px 7px;margin-right:6px;border-radius:50%;background:#2b4562;color:#fff;font-weight:700}
@media (hover:none),(max-width:640px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">🍌 Asher’s Banana</div>
    <div class="clock" id="clock"></div>
  </header>

  <section class="hero" aria-live="polite">
    <div class="bg" id="bg"></div>
    <div class="meta">
      <h1 id="t"></h1>
      <p id="d"></p>
      <a class="play" id="play" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg>Play</a>
    </div>
  </section>

  <nav class="shelf" id="shelf" aria-label="Games"></nav>

  <div class="hint"><span><b>◀ ▶</b>Browse</span><span><b>↵</b>Play</span></div>
</div>

<script>
/* ------------------------------------------------------------------
   ADD A GAME: copy one line below, change the name, url and desc,
   then upload this file again. Visitors can't change the list.
------------------------------------------------------------------ */
var GAMES = [
  { name: 'Pixel Bistro',  url: 'https://pixelbistro.vercel.app/', desc: 'Run a tiny restaurant. Serve guests, earn coins, grow your bistro.' },
  { name: 'Pixel Fighter', url: 'https://pixel-fighter-rollback-netcode.vercel.app/', desc: 'A pixel fighting game with rollback netcode.' }
];

(function () {
  var shelf = document.getElementById('shelf'), bg = document.getElementById('bg'),
      tEl = document.getElementById('t'), dEl = document.getElementById('d'), play = document.getElementById('play');
  var tiles = [], idx = 0, bgFrame = null, bgTimer = null;

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function frame(src, title) {
    var f = document.createElement('iframe');
    /* Previews are fully isolated from the real game:
       - sandbox without allow-same-origin: no access to the game's saves, localStorage or cookies
       - credentialless: previews load with a throwaway storage, cookie and cache (Chrome, Edge)
       - empty allow: no camera, mic, etc. */
    f.setAttribute('sandbox', 'allow-scripts');
    f.setAttribute('credentialless', '');
    f.setAttribute('allow', '');
    f.setAttribute('tabindex', '-1'); f.setAttribute('aria-hidden', 'true');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.title = title; f.src = src; return f;
  }
  function fitTile(art) { var f = art.querySelector('iframe'); if (f) f.style.transform = 'scale(' + (art.clientWidth / 1280) + ')'; }
  function fitBg() {
    if (!bgFrame) return;
    var sc = Math.max(bg.clientWidth / 1280, bg.clientHeight / 720);
    bgFrame.style.transform = 'translate(-50%,-50%) scale(' + sc + ')';
  }
  function open(g) { window.open(g.url, '_blank', 'noopener'); }

  function build() {
    GAMES.forEach(function (g, i) {
      var b = el('button', 'tile'); b.type = 'button';
      b.setAttribute('aria-label', g.name);
      var art = el('div', 'art');
      art.appendChild(el('div', 'ph', g.name.charAt(0).toUpperCase()));
      var f = frame(g.url, 'Preview of ' + g.name); f.setAttribute('loading', 'lazy');
      art.appendChild(f);
      b.appendChild(art); b.appendChild(el('span', 'name', g.name));
      b.onclick = function () { if (i === idx) open(g); else select(i); };
      b.onfocus = function () { if (i !== idx) select(i); };
      shelf.appendChild(b); tiles.push(b);
    });
  }

  function select(i, instant) {
    if (!GAMES.length) return;
    idx = (i + GAMES.length) % GAMES.length;
    var g = GAMES[idx];
    tiles.forEach(function (t, k) { t.classList.toggle('sel', k === idx); });
    tiles[idx].scrollIntoView({ behavior: instant ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
    tEl.textContent = g.name; dEl.textContent = g.desc || '';
    dEl.style.display = g.desc ? '' : 'none';
    play.href = g.url;
    clearTimeout(bgTimer);
    bgTimer = setTimeout(function () {
      if (bgFrame) bgFrame.remove();
      bgFrame = frame(g.url, 'Preview of ' + g.name);
      bg.appendChild(bgFrame); fitBg();
      bgFrame.onload = function () { bgFrame.classList.add('on'); };
      setTimeout(function () { if (bgFrame) bgFrame.classList.add('on'); }, 1500);
    }, instant ? 0 : 250);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); select(idx + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); select(idx - 1); }
    else if (e.key === 'Enter' && document.activeElement !== play) { e.preventDefault(); open(GAMES[idx]); }
  });

  function tick() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  tick(); setInterval(tick, 20000);

  function fitAll() { tiles.forEach(function (t) { fitTile(t.firstChild); }); fitBg(); }
  window.addEventListener('resize', fitAll);

  if (!GAMES.length) { tEl.textContent = 'No games yet'; dEl.textContent = 'Add one in the GAMES list in index.html.'; play.style.display = 'none'; return; }
  build(); fitAll(); select(0, true);
  requestAnimationFrame(fitAll);
})();
</script>
</body>
</html>
